<!doctype html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-3bTgbmZYTbiJdN2K5OKO9z3Yc7WWnz0xRp/fk/90mtI='; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlowKit 工作流</title>
<style>
:root{
  --bg:#f4f6fa;--surface:#fff;--line:#e5eaf1;--ink:#172033;--muted:#778196;
  --blue:#5278e8;--green:#16a36a;--amber:#d58b21;--red:#df5555;--purple:#8b5cf6;--teal:#0d9488;
  --shadow:0 10px 30px rgba(27,43,72,.10);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex;flex-direction:column;min-width:960px}
.topbar{height:66px;flex:0 0 66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;gap:18px;z-index:20}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5379ed,#7b61db);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 4px 12px rgba(83,121,237,.25)}
.brand-title{font-weight:750;font-size:15px;letter-spacing:-.2px}
.breadcrumb{font-size:12px;color:#8a93a5;margin-top:3px}
.breadcrumb b{color:#47536a;font-weight:600}
.top-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.stat{display:flex;align-items:center;gap:6px;border:1px solid #e7ebf2;border-radius:8px;padding:6px 9px;background:#fbfcfe;color:#647087;font-size:11px;white-space:nowrap}
.stat strong{font-size:12px;color:#27334a}
.demo-tag{font-size:10px;font-weight:700;color:#5b63cb;background:#f0efff;border:1px solid #e1ddff;padding:5px 8px;border-radius:6px;letter-spacing:.4px}
.toolbar{height:54px;flex:0 0 54px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:12px;z-index:19}
.toolbar-left,.toolbar-right{display:flex;align-items:center;gap:8px;min-width:0}
.view-tab{border:0;background:transparent;color:#8a93a5;padding:8px 12px;border-radius:7px;font-size:12px}
.view-tab.active{background:#eef2ff;color:#405fd0;font-weight:700}
.search-wrap{height:34px;width:230px;border:1px solid #e3e8f0;border-radius:8px;display:flex;align-items:center;gap:7px;padding:0 9px;background:#fbfcfe}
.search-wrap span{color:#8b96aa;font-size:15px}
.search-wrap input{border:0;outline:0;background:transparent;width:100%;font-size:12px;color:#263249}
.search-wrap input::placeholder{color:#a1a9b8}
.tool-btn{height:33px;border:1px solid #e2e7ef;background:#fff;color:#536078;border-radius:7px;padding:0 10px;font-size:11px;display:flex;align-items:center;gap:6px;transition:.15s}
.tool-btn:hover{background:#f6f8fc;border-color:#cbd4e2;color:#26334b}
.tool-btn.icon-only{width:34px;justify-content:center;padding:0;font-size:15px}
.zoom-readout{min-width:42px;text-align:center;font-size:11px;color:#667188;font-variant-numeric:tabular-nums}
.divider-v{height:20px;width:1px;background:#e7ebf1;margin:0 3px}
.viewport{position:relative;flex:1;overflow:hidden;background-color:#f6f8fc;background-image:radial-gradient(#dce3ee 1px,transparent 1px);background-size:22px 22px;touch-action:none;cursor:grab}
.viewport.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:3036px;height:1200px;transform-origin:0 0;text-rendering:geometricPrecision}
.world.camera-animate{transition:transform .46s cubic-bezier(.2,.78,.25,1)}
.world.overview-scale .node-type,.world.overview-scale .node-id,.world.overview-scale .stage-subtitle{opacity:0}
#stageLayer,#nodeLayer{position:absolute;inset:0}
#nodeLayer{pointer-events:none}
#nodeLayer .node{pointer-events:auto}
#stageLayer{pointer-events:none}
.stage{position:absolute;border:1px solid color-mix(in srgb,var(--stage-color) 28%,#e3e9f2);border-radius:17px;background:linear-gradient(145deg,color-mix(in srgb,var(--stage-color) 4%,#fff),rgba(255,255,255,.82));box-shadow:0 4px 18px rgba(38,55,88,.035)}
.stage-head{position:absolute;left:17px;right:14px;top:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stage-title{font-size:13px;font-weight:750;color:#344158;display:flex;align-items:center;gap:8px;white-space:nowrap}
.stage-dot{width:8px;height:8px;border-radius:50%;background:var(--stage-color);box-shadow:0 0 0 4px color-mix(in srgb,var(--stage-color) 12%,transparent)}
.stage-count{font-size:10px;color:#78849a;background:rgba(255,255,255,.8);border:1px solid #e9edf3;border-radius:6px;padding:4px 7px;white-space:nowrap}
.stage-subtitle{position:absolute;top:42px;left:18px;font-size:10px;color:#9aa3b2;letter-spacing:.1px}
.ci-group{position:absolute;left:1610px;top:137px;width:620px;height:195px;border:1px dashed #c8b5fa;border-radius:13px;background:rgba(139,92,246,.045)}
.ci-group-title{position:absolute;left:13px;top:9px;font-size:10px;font-weight:700;color:#8060c9;letter-spacing:.2px}
.edge-layer{position:absolute;left:0;top:0;width:3036px;height:1200px;overflow:visible;pointer-events:none}
.edge-visible{fill:none;stroke-width:2.5;shape-rendering:geometricPrecision;stroke-linecap:round;stroke-linejoin:round;opacity:.75;transition:opacity .18s,stroke-width .18s}
.edge-visible.kind-normal{stroke:#8795aa}
.edge-visible.kind-success{stroke:#16a36a}
.edge-visible.kind-branch{stroke:#d58b21}
.edge-visible.kind-error{stroke:#df5555;stroke-dasharray:7 6;opacity:.53}
.edge-visible.kind-loop{stroke:#8b5cf6;stroke-dasharray:8 5}
.edge-visible.kind-parallel{stroke:#0d9488}
.edge-visible.kind-control{stroke:#a1a9b8;stroke-dasharray:2 6;opacity:.62}
.edge-hit{fill:none;stroke:transparent;stroke-width:15;pointer-events:stroke;cursor:pointer}
.edge-group:hover .edge-visible{opacity:1;stroke-width:3}
.edge-group.active .edge-visible{opacity:1;stroke-width:4.6;filter:drop-shadow(0 0 4px rgba(39,87,172,.22))}
.edge-group.dimmed .edge-visible{opacity:.025}
.edge-group.active .edge-visible{stroke-dasharray:12 8;animation:flowline .95s linear infinite}
@keyframes flowline{to{stroke-dashoffset:-40}}
.motion-layer{pointer-events:none}
.motion-dot{pointer-events:none;stroke:#fff;stroke-width:1.6;filter:drop-shadow(0 0 3px rgba(0,0,0,.22))}
.motion-halo{pointer-events:none;opacity:.3}
@media (prefers-reduced-motion:reduce){.edge-group.active .edge-visible{animation:none}.node.selected .pulse-ring{animation:none}}
.edge-label{opacity:0;pointer-events:none;transition:opacity .15s}
.edge-group:hover .edge-label,.edge-group.active .edge-label{opacity:1}
.edge-label rect{fill:#fff;stroke:#dce3ed;stroke-width:1;rx:6;filter:drop-shadow(0 2px 3px rgba(20,30,50,.08))}
.edge-label text{font-size:10px;font-weight:700;fill:#4c5870;text-anchor:middle;dominant-baseline:middle}
.node{position:absolute;display:flex;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;flex-direction:column;justify-content:center;gap:3px;padding:8px 10px 7px;border:1px solid #dce4f0;border-radius:11px;background:#fff;box-shadow:0 4px 12px rgba(40,57,91,.08);cursor:pointer;user-select:none;transition:box-shadow .16s,border-color .16s,transform .16s,opacity .16s;z-index:3;overflow:hidden}
.node:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--node-color)}
.node:hover{border-color:var(--node-color);box-shadow:0 8px 22px rgba(42,62,100,.16);transform:translateY(-2px);z-index:8}
.node.selected{border:2px solid var(--node-color);box-shadow:0 0 0 4px color-mix(in srgb,var(--node-color) 13%,transparent),0 8px 20px rgba(42,62,100,.14);z-index:9}
.node.path-node{border-color:var(--node-color);box-shadow:0 0 0 3px color-mix(in srgb,var(--node-color) 11%,transparent)}
.node.dimmed{opacity:.14}
.node-top{display:flex;align-items:center;justify-content:space-between;gap:5px;min-height:12px}
.node-type{font-size:9.5px;line-height:1;color:var(--node-color);font-weight:800;letter-spacing:.65px;text-transform:uppercase;white-space:nowrap}
.node-icon{font-size:11px;color:var(--node-color);font-weight:800;line-height:1}
.node-title{font-size:12.5px;line-height:1.3;font-weight:750;letter-spacing:.02px;color:#26334a;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.node-id{font-size:9px;line-height:1;color:#98a2b2;letter-spacing:.05px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.gate{background:#fffdf7;border-color:#f0dfbd}
.node.gate:before{background:#d58b21}
.node.terminal{border-radius:13px;background:#fbfcff}
.node.terminal:before{background:var(--node-color)}
.node.helper{border-radius:50%;padding:0;align-items:center;justify-content:center;background:#f5f1ff;border:1.5px solid #b8a1f2;box-shadow:0 3px 9px rgba(100,70,160,.12)}
.node.helper:before{display:none}
.helper-glyph{font-size:19px;color:#8059d5;line-height:1}
.helper-label{font-size:8px;font-weight:800;color:#8059d5;white-space:nowrap}
.node.exception{background:#fff7f7;border-color:#efb8b8}
.node.exception:before{background:#df5555}
.node.success-end{background:#f2fbf6;border-color:#bde6ce}
.node.error-end{background:#fff6f6;border-color:#f0c1c1}
.node.warning-end{background:#fffbf2;border-color:#f0dfb9}
.node.rollback-end{background:#f7f4ff;border-color:#d5c7fb}
.pulse-ring{position:absolute;inset:-5px;border:2px solid var(--node-color);border-radius:14px;opacity:0;pointer-events:none}
.node.selected .pulse-ring{animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.98);opacity:.6}100%{transform:scale(1.16);opacity:0}}
.canvas-hint{position:absolute;left:18px;top:16px;background:rgba(255,255,255,.86);border:1px solid #e5eaf1;border-radius:8px;padding:7px 10px;font-size:10px;color:#8994a7;z-index:8;backdrop-filter:blur(8px);pointer-events:none}
.canvas-hint b{color:#56647b;font-weight:700}
.legend{position:absolute;left:18px;bottom:17px;background:rgba(255,255,255,.94);border:1px solid #e4e9f1;border-radius:10px;padding:9px 11px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(31,45,73,.07);z-index:10;backdrop-filter:blur(8px)}
.legend-item{display:flex;align-items:center;gap:5px;font-size:9px;color:#68758b;white-space:nowrap}
.legend-line{width:19px;height:0;border-top:2px solid}
.legend-line.dashed{border-top-style:dashed}
.legend-line.dotted{border-top-style:dotted}
.minimap{position:absolute;right:20px;bottom:18px;width:194px;height:112px;background:rgba(255,255,255,.94);border:1px solid #dfe5ee;border-radius:10px;box-shadow:0 5px 18px rgba(31,45,73,.09);z-index:10;overflow:hidden;cursor:crosshair}
.minimap-title{position:absolute;left:9px;top:6px;font-size:9px;font-weight:700;color:#77839a;z-index:2}
.minimap-inner{position:absolute;left:4px;top:20px;width:184px;height:96px;overflow:hidden}
.minimap-world{position:absolute;left:0;top:0;width:3036px;height:1200px;transform:scale(0.06060606,.08);transform-origin:0 0}
.mini-stage{position:absolute;border:2px solid var(--stage-color);background:color-mix(in srgb,var(--stage-color) 12%,white);border-radius:18px}
.mini-node{position:absolute;border-radius:8px;background:#8b9ab2}
.mini-viewport{position:absolute;left:0;top:0;border:3px solid #4c6fe8;background:rgba(76,111,232,.09);border-radius:2px;pointer-events:none;box-shadow:0 0 0 1px rgba(255,255,255,.8)}
.inspector{position:absolute;right:18px;top:16px;bottom:16px;width:360px;background:rgba(255,255,255,.97);border:1px solid #e0e6ef;border-radius:15px;box-shadow:0 14px 40px rgba(28,43,73,.16);z-index:15;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(14px);transition:transform .22s ease,opacity .22s}
.inspector.closed{transform:translateX(calc(100% + 26px));opacity:0;pointer-events:none}
.inspector-head{padding:16px 17px 13px;border-bottom:1px solid #edf0f5;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.inspector-eyebrow{font-size:9px;font-weight:800;letter-spacing:1px;color:#8d98ab;text-transform:uppercase;margin-bottom:5px}
.inspector-title{font-size:15px;font-weight:750;color:#243149;line-height:1.35}
.inspector-sub{font-size:10px;color:#8b95a7;margin-top:4px}
.close-btn{border:0;background:#f3f5f9;color:#7b879b;width:27px;height:27px;border-radius:7px;font-size:16px;line-height:1}
.inspector-body{padding:15px 17px 22px;overflow:auto;flex:1}
.overview-number{font-size:25px;font-weight:800;letter-spacing:-.8px;color:#273653}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
.overview-stat{border:1px solid #e8edf4;border-radius:9px;padding:10px;background:#fbfcfe}
.overview-stat small{font-size:9px;color:#8a95a8;display:block;margin-bottom:5px}
.overview-stat strong{font-size:17px;color:#34415a}
.panel-section{margin-top:17px}
.section-title{font-size:10px;font-weight:800;color:#78849a;letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px}
.info-box{background:#f7f9fc;border:1px solid #e9edf3;border-radius:9px;padding:10px 11px;font-size:11px;line-height:1.65;color:#58657c}
.notice{background:#fffaf0;border:1px solid #f2e5c7;border-radius:9px;padding:9px 10px;font-size:10px;line-height:1.6;color:#94713b}
.meta-list{display:grid;grid-template-columns:82px 1fr;gap:8px 10px;font-size:10px;line-height:1.5}
.meta-list .k{color:#8a95a7}.meta-list .v{color:#45536b;font-weight:600;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;border-radius:6px;padding:4px 7px;font-size:9px;font-weight:750;border:1px solid #e5eaf2;background:#f8fafd;color:#68758a}
.pill.blue{background:#eef3ff;color:#4d6fd4;border-color:#dce6ff}
.pill.green{background:#eefaf3;color:#168557;border-color:#d6f0e1}
.pill.orange{background:#fff7e9;color:#b87919;border-color:#f3e2bf}
.pill.red{background:#fff1f1;color:#c94c4c;border-color:#f2d4d4}
.pill.purple{background:#f5f0ff;color:#8059d5;border-color:#e4d9ff}
.pill.teal{background:#ecfaf8;color:#0b897e;border-color:#d0f0eb}
.edge-ends{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:6px}
.edge-end{border:1px solid #e5eaf2;border-radius:8px;padding:9px 8px;min-width:0}
.edge-end small{display:block;color:#98a2b2;font-size:8px;margin-bottom:4px}
.edge-end strong{display:block;color:#3b4962;font-size:10px;overflow-wrap:anywhere}
.list-stack{display:flex;flex-direction:column;gap:6px}
.relation-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border:1px solid #e8edf3;border-radius:8px;background:#fff;text-align:left;width:100%;color:#526078}
.relation-row:hover{border-color:#bdcafa;background:#f8faff}
.relation-row span{font-size:10px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relation-row small{font-size:8px;color:#9aa4b4;white-space:nowrap}
.panel-actions{display:flex;gap:7px;margin-top:11px}
.panel-btn{border:1px solid #dfe6f0;background:#fff;color:#526078;border-radius:7px;padding:7px 9px;font-size:10px}
.panel-btn.primary{background:#4d6fe0;border-color:#4d6fe0;color:#fff}
.panel-btn:hover{filter:brightness(.98)}
.tooltip{position:absolute;z-index:30;display:none;max-width:280px;padding:8px 10px;border-radius:8px;background:#1f2b42;color:#fff;font-size:10px;line-height:1.5;box-shadow:0 7px 20px rgba(15,25,45,.2);pointer-events:none}
.status-toast{position:absolute;left:50%;top:15px;transform:translateX(-50%);z-index:22;background:#26334b;color:#fff;padding:8px 12px;border-radius:8px;font-size:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.status-toast.show{opacity:1}

.stage{transition:opacity .2s,border-color .2s,box-shadow .2s}
.stage.is-dimmed{opacity:.12}
.stage.is-focus{border-color:color-mix(in srgb,var(--stage-color) 58%,#fff);box-shadow:0 0 0 2px color-mix(in srgb,var(--stage-color) 10%,transparent),0 7px 24px rgba(35,52,84,.07)}
.canvas-hint{max-width:min(620px,calc(100% - 420px));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sample-banner{display:flex;flex-direction:column;gap:4px;padding:9px 10px;border:1px solid #dce6ff;background:linear-gradient(135deg,#f2f6ff,#fbfcff);border-radius:9px;margin-bottom:13px}
.sample-banner strong{font-size:10px;color:#4b63b6;letter-spacing:.3px}
.sample-banner p{margin:0;font-size:9px;line-height:1.5;color:#7180a0}
.sample-banner .sample-label{font-size:8px;font-weight:850;letter-spacing:1px;color:#6d7ed0}
.role-card{border:1px solid #e6ebf4;border-radius:9px;padding:10px;background:#fbfcff}
.role-card strong{display:block;font-size:11px;color:#34425d}
.role-card p{margin:5px 0 0;font-size:10px;line-height:1.55;color:#68758b}
.role-card small{display:block;margin-top:7px;font-size:9px;color:#8b96a8}
.skill-chips{display:flex;flex-wrap:wrap;gap:6px}
.skill-chip{display:inline-flex;padding:5px 7px;border-radius:6px;border:1px solid #e0e7f4;background:#f7f9ff;color:#52648d;font-size:9px;font-weight:700}
.contract-stack{display:flex;flex-direction:column;gap:7px}
.contract-card{border:1px solid #e7ecf3;border-radius:8px;padding:8px 9px;background:#fff}
.contract-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.contract-card strong{font-size:10px;color:#3f4d65;overflow-wrap:anywhere}
.contract-card code{font-size:8px;color:#71809a;background:#f3f6fa;padding:3px 5px;border-radius:4px;white-space:nowrap}
.contract-card p{font-size:9px;line-height:1.5;color:#8792a4;margin:5px 0 0}
.bullet-list{margin:0;padding-left:16px;color:#59667d;font-size:10px;line-height:1.7}
.focus-tag{display:none;align-items:center;gap:7px;background:#eef3ff;border:1px solid #dce6ff;color:#4e67bd;padding:5px 8px;border-radius:7px;font-size:9px;font-weight:750}
.focus-tag.visible{display:inline-flex}
.focus-tag button{border:0;background:transparent;color:#425fc5;font-size:9px;font-weight:800;padding:0;text-decoration:underline}
.edge-group.active .edge-visible{filter:drop-shadow(0 0 3px color-mix(in srgb, currentColor 25%, transparent))}
@media(prefers-reduced-motion:reduce){.world.camera-animate,.stage,.node,.edge-visible{transition:none!important}.edge-group.active .edge-visible{animation:none!important}}

@media(max-width:1150px){
 .topbar{padding:0 12px}.stat:nth-child(3){display:none}.search-wrap{width:180px}
 .inspector{width:330px}.legend{gap:7px}.legend-item{font-size:8px}
}

/* V3: long metadata reading + interactive contracts */
.inspector{width:408px}
.inspector-body{overscroll-behavior:contain;min-height:0;scrollbar-gutter:stable}
.panel-section{scroll-margin-top:48px}
.section-title{font-size:11px;letter-spacing:.3px}
.info-box{font-size:12px;line-height:1.75}
.panel-jumplinks{position:sticky;top:-15px;z-index:5;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:-15px -17px 12px;padding:12px 15px 10px;background:rgba(255,255,255,.97);border-bottom:1px solid #edf0f5}
.panel-jumplinks::-webkit-scrollbar{display:none}
.panel-jumplinks button{border:1px solid #e5ebf4;border-radius:7px;background:#f7f9fd;color:#65758f;padding:7px 9px;font-size:10px;white-space:nowrap;flex:0 0 auto}
.panel-jumplinks button:hover{background:#eef3ff;border-color:#c7d7fc;color:#4768c8}
.rich-section .rich-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.rich-section .rich-heading .section-title{margin:0}
.rich-section .rich-controls{display:flex;gap:5px;flex-shrink:0}
.rich-section .rich-controls button{border:1px solid #dee5f2;background:#fff;color:#526cc3;padding:5px 8px;font-size:10px;border-radius:6px}
.rich-section .rich-controls button:hover{background:#eef3ff}
.rich-section .rich-controls button:focus-visible,.contract-trigger:focus-visible,.reader-action:focus-visible,.panel-jumplinks button:focus-visible{outline:2px solid #557bf0;outline-offset:2px}
.rich-preview{position:relative;border:1px solid #e5eaf4;border-radius:9px;background:#fafbfe;padding:11px 12px;font-size:11px;line-height:1.75;color:#526078;overflow:hidden;overflow-wrap:anywhere}
.rich-preview.collapsed{max-height:128px}

<script>(() => {
'use strict';
const $ = id => document.getElementById(id);
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
const types = { action:'执行', verification:'校验', condition:'条件', human:'人工确认',
  parallel:'并行', loop:'循环', agent:'Agent', terminal:'终点', end:'终点', design:'设计步骤' };
const roles = { next:'继续', 'action-error':'技术失败', 'verification-success':'校验通过',
  'verification-failure':'校验失败', 'human-approve':'批准', 'human-reject':'要求修订',
  'human-decline':'拒绝', 'parallel-member':'进入并行分支', 'parallel-join':'并行汇合',
  'condition-branch':'条件分支' };
const colors={normal:'#8795aa',success:'#16a36a',branch:'#d58b21',error:'#df5555',loop:'#8b5cf6',parallel:'#0d9488',control:'#a1a9b8'};
const kindIcons={action:'▣',gate:'◇',terminal:'●',helper:'⇉',exception:'!'};
const cardTypes={action:'执行节点',verification:'校验节点',condition:'条件判断',human:'人工确认',
  parallel:'并行节点',loop:'循环控制',agent:'Agent 节点',terminal:'流程终点'};
const cardType=node=>node.spec?(cardTypes[node.spec.type]??readableTypes(node.spec)):'辅助控制';
const chartKind = node => ({
  verification:'gate', condition:'gate', human:'gate', loop:'gate', end:'terminal', terminal:'terminal',
})[node.type] ?? 'action';
const records = list => new Map(list.map(item => [item.id, item]));
const readableTypes = spec => types[spec.type] ?? spec.type;
function prepare(config) {
  const {graph, layout} = config;
  if (config.schemaVersion!==1 || graph.schemaVersion!==1) throw new Error('无法读取该工作流配置版本。');
  const actualNodes = records(graph.nodes);
  const actualEdges = new Map([...graph.referenceEdges,...graph.executionEdges.filter(edge=>edge.origin==='derived')]
    .map(edge => [edge.edgeId, edge]));
  const phaseMap = records(layout.phases);
  const visualNodes = layout.nodes.map(place => {
    const spec = actualNodes.get(place.nodeId);
    if ((!spec && place.helper!=='runtime-notice') || !phaseMap.has(place.phase)) throw new Error('存在无法定位的节点。');
    const kind = place.helper ? (spec ? 'helper' : 'exception') : chartKind(spec);
    const visualKind = !place.helper && ['action','gate','terminal'].includes(place.visualKind)
      ? place.visualKind : kind;
    const referenceDescription = typeof place.description==='string' && place.description.length>0;
    const description = !spec ? '流程结构中的异常说明。具体故障与恢复结果由宿主的运行记录提供。' :
      place.descriptionSource==='host' ? place.description :
      place.helper ? '同一个并行节点的结构标记。可查看分支入口、成员及汇合条件。' :
      referenceDescription ? place.description : [readableTypes(spec), spec.capabilityId ? '能力标识 ' + spec.capabilityId : '',
        spec.status ? '结束状态 ' + spec.status : ''].filter(Boolean).join(' · ');
    return {...place, kind, visualKind, spec, referenceDescription, label:place.label??spec.name??spec.id, slug:spec?.id??place.id, description,
      h:place.helper ? place.h : Math.max(['PlanRelease','RecordReviewFeedback','CloseoutFailed','RollbackRelease',
        'VerifyIntentResult','RouteIntent'].includes(place.id)?98:86,place.h)};
  });
  const sets = new Set(visualNodes.map(node => node.nodeId).filter(Boolean));
  const visualById = records(visualNodes);
  if (visualById.size!==visualNodes.length) throw new Error('展示节点标识重复。');
  const parallelRegions = new Map(graph.regions.filter(region=>region.kind==='parallel').map(region=>[region.ownerId,region]));
  const mapped = new Set();
  const visualEdges = layout.edges.map(place => {
    const spec = actualEdges.get(place.edgeId);
    const source=visualById.get(place.source), target=visualById.get(place.target);
    if (!source || !target || !Object.hasOwn(colors,place.kind)) throw new Error('存在无法校对的连线。');
    if (!spec) {
      if (place.edgeId || place.kind!=='control' || source.helper!=='parallel-join' || target.helper!=='runtime-notice') {

function tracePrimaryUpstream(id,maxSteps=20){

  if(!incoming.length)break;
  // Prefer the nearest successful/normal incoming transition, not a remote exception branch.
  const here=nodes.get(current);
  incoming.sort((a,b)=>{
   const score=e=>{const n=nodes.get(e.source);return n&&here?Math.hypot(n.x-here.x,n.y-here.y)+(e.kind==='branch'?65:0):Infinity;};
   return score(a)-score(b);
  });
  const edge=incoming[0];if(tracedNodes.has(edge.source)||edge.source===id)break;
  tracedNodes.add(edge.source);tracedEdges.add(edge.id);current=edge.source;

}

 const focusedPhases=new Set();
 if(selectedNode){
   const related=new Set([selectedNode]),activeEdges=new Set();
   if(pathMode){
     const queue=[selectedNode],seen=new Set([selectedNode]);
     while(queue.length){const current=queue.shift();edges.filter(e=>e.source===current).forEach(e=>{activeEdges.add(e.id);related.add(e.target);if(!seen.has(e.target)){seen.add(e.target);queue.push(e.target);}});}
     edges.filter(e=>e.target===selectedNode).forEach(e=>activeEdges.add(e.id));
   }else{
     focusConnections(selectedNode).forEach(e=>{activeEdges.add(e.id);related.add(e.source);related.add(e.target);});
   }
   const upstream=tracePrimaryUpstream(selectedNode);
   activeEdges.forEach(id=>edgeElements.get(id)?.classList.add('active'));
   upstream.edges.forEach(id=>{if(!activeEdges.has(id))edgeElements.get(id)?.classList.add('upstream');});

   edgeElements.forEach((el,id)=>{if(!activeEdges.has(id)&&!upstream.edges.has(id))el.classList.add('dimmed');});
   related.forEach(id=>{const phase=nodes.get(id)?.phase;if(phase)focusedPhases.add(phase);});
 }else if(selectedEdge){
   const e=edges.find(x=>x.id===selectedEdge);
   if(e){nodeElements.get(e.source)?.classList.add('path-node');nodeElements.get(e.target)?.classList.add('path-node');[e.source,e.target].forEach(id=>{const phase=nodes.get(id)?.phase;if(phase)focusedPhases.add(phase);});}

   nodeElements.forEach((el,id)=>{if(e&&id!==e.source&&id!==e.target)el.classList.add('dimmed');});
 }
 if(selectedNode||selectedEdge){stageElements.forEach((el,id)=>{el.classList.toggle('is-focus',focusedPhases.has(id));el.classList.toggle('is-dimmed',!focusedPhases.has(id));});}

}

function animateAmbient(now){

let motionRaf=null,motionShapes=[],motionPaused=false,motionPrevious=null;

function animateMotionFrame(now){

  motionShapes.forEach(m=>{
   m.elapsed+=delta;

function motionChoicesForSelection(){

 const n=nodes.get(selectedNode);if(!n)return [];

 const outbound=choices.filter(e=>e.source===selectedNode&&!['error','control'].includes(e.kind));
 const rank={success:0,normal:1,parallel:2,branch:3,loop:4,error:5,control:6};
 outbound.sort((a,b)=>(rank[a.kind]??7)-(rank[b.kind]??7));

function updateMotionSizes(currentScale=renderedScale()){

 motionShapes.forEach(m=>{
  m.core.setAttribute('r',(4.4*inv).toFixed(2));
  m.core.style.strokeWidth=(1.4*inv)+'px';
  m.halo.setAttribute('r',(10*inv).toFixed(2));
  m.trail.style.strokeWidth=(3.2*inv)+'px';
 });
}
function placeMotionShape(m){
 const p=m.path.getPointAtLength(m.length*((m.elapsed%m.duration)/m.duration));
 m.core.setAttribute('cx',p.x);m.core.setAttribute('cy',p.y);
 m.halo.setAttribute('cx',p.x);m.halo.setAttribute('cy',p.y);
 const head=m.length*((m.elapsed%m.duration)/m.duration),tail=Math.max(0,head-26/Math.max(.12,scale));
 if(head-tail<1){m.trail.setAttribute('d','');return;}
 const samples=[];for(let i=0;i<=6;i++){
  const pt=m.path.getPointAtLength(tail+(head-tail)*i/6);

function refreshEdgeMotion(){

 if(motionPaused||document.hidden||(!selectedNode&&!selectedEdge))return;

  const path=edgeElements.get(e.id)?.querySelector('.edge-visible');if(!path)continue;

  trail.setAttribute('d','');

  const halo=document.createElementNS('http://www.w3.org/2000/svg','circle');

  const core=document.createElementNS('http://www.w3.org/2000/svg','circle');
  core.setAttribute('class','motion-comet');core.setAttribute('r','4.4');core.setAttribute('fill',color);
  layer.append(halo,core);
  let length=120;try{length=path.getTotalLength();}catch{}

    if (badge) {
      badge.textContent=count>1?'◉ '+count:'◉';
      badge.title=count?'待处理 '+count+' 项':'';
    }
  }
  const execution=$('panel-section-execution');
  if (execution && selectedNode) {
    execution.innerHTML='<div class="section-title">执行状态</div>'+runDetails(nodes.get(selectedNode));
  }
  const overview=$('panel-section-run-overview');
  if (overview) {
    overview.innerHTML='<div class="section-title">只读运行状态</div>'+
      (DATA.runView?facts(runSummary()):note('该运行当前不可查看。'));
  }
}

function openForkPoints(button) {
  const view=DATA.runView;
  const output=button.parentElement.querySelector('[data-fork-choices]');
  if (!view?.forkUrl || !['succeeded','failed','errored','cancelled'].includes(view.status)) {
    output.textContent='运行结束后可以选择复跑点。';
    return;
  }
  const endpoint=new URL(view.forkUrl,location.href);
  if (endpoint.origin!==location.origin || endpoint.pathname!=='/runs/'+encodeURIComponent(view.runId)+'/fork') return;
  output.innerHTML='<label>历史执行 <select aria-label="历史执行"></select></label>'+
    '<p data-fork-entry></p><label><input type="checkbox"> 请求重做起点后的外部写入</label>'+
    '<p>复用入口前已提交的结果。未勾选时，复跑遇到外部写入会停止派发；勾选后仍需宿主授权。</p>'+
    '<button type="button" class="panel-btn primary" data-fork-start>从这次执行重新开始</button> '+
    '<button type="button" class="panel-btn" data-fork-more hidden>更早的执行</button>'+
    '<p role="status" data-fork-message></p>';
  const select=output.querySelector('select'), redo=output.querySelector('input');
  const start=output.querySelector('[data-fork-start]'), more=output.querySelector('[data-fork-more]');
  const detail=output.querySelector('[data-fork-entry]'), message=output.querySelector('[data-fork-message]');
  const points=new Map();
  const label=id=>actualNodes.get(id)?.name??id;
  let next=null;

  function showEntry() {
    const point=points.get(select.value);
    start.disabled=!point;
    redo.disabled=!point;
    detail.textContent=point ? '实际起点 · '+label(point.startNodeId)+
      (point.scope.length?' · 从当次并行组入口重跑整个并行组':'')+
      ' · 入口修订 '+point.entryRevision : '';
  }
  async function load(before) {
    more.disabled=true;
    const query=new URL(endpoint);
    query.searchParams.set('nodeId',button.dataset.forkNode);
    if (before!==null) query.searchParams.set('beforeRevision',String(before));
    try {
      const response=await fetch(query,{cache:'no-store'});
      const result=await response.json();
      if (!response.ok) throw new Error(result.error);
      for (const point of result.points) {
        if (points.has(String(point.revision))) continue;
        const activation=point.activation===undefined?'入口':'激活 '+point.activation+' · 尝试 '+point.attempt;
        const scope=point.scope.map(({laneId})=>label(laneId)).join(' / ');
        points.set(String(point.revision),point);
        select.add(new Option('修订 '+point.revision+' · '+activation+(scope?' · '+scope:''),String(point.revision)));
      }
      next=result.next;
      more.hidden=next===null;
      message.textContent=points.size?'':'这条运行没有可用的入口状态。';
      showEntry();
    } catch (error) {
      message.textContent=error.message||'无法读取复跑记录。';
    } finally {more.disabled=false;}
  }
  select.addEventListener('change',showEntry);
  more.addEventListener('click',()=>load(next));
  start.addEventListener('click',async()=>{
    const point=points.get(select.value);
    if (!point || DATA.runView?.runId!==view.runId) return;
    const redoWrites=redo.checked;
    const key='flowkit-fork:'+view.runId+':'+point.revision+':'+redoWrites;
    const startKey=sessionStorage.getItem(key)??crypto.randomUUID();
    sessionStorage.setItem(key,startKey);
    start.disabled=select.disabled=redo.disabled=true;
    message.textContent='正在创建新运行。';
    try {
      const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({revision:point.revision,entryRevision:point.entryRevision,startKey,redoWrites})});
      const result=await response.json();
      if (!response.ok) throw new Error(result.error);
      if (result.runUrl && new URL(result.runUrl).origin===location.origin) {
        sessionStorage.removeItem(key);
        location.assign(result.runUrl);
        return;
      }
      message.textContent='新运行已创建（'+result.runId+'），暂时无法打开查看链接。可用同一请求重试打开。';
    } catch(error) {
      message.textContent=error.message||'暂时无法发起复跑。';
    }
    start.disabled=select.disabled=redo.disabled=false;
  });
  showEntry();
  load(null);
}

function watchRun() {
  const initial=DATA.runView;
  const progressUrl=new URL(initial.progressUrl,location.href);
  const status=$('liveRunStatus');
  if (!status || progressUrl.origin!==location.origin || progressUrl.pathname!==location.pathname+'/progress') return;
  const terminal=new Set(['succeeded','failed','errored','cancelled']);
  let timer, busy=false, stopped=false, retry=1000;

  function showConnection(message='') {
    const view=DATA.runView;
    const count=view?.pending.length??0;
    const summary=view?[runLabels[view.status], '修订 '+view.revision,
      count?'待办 '+count+' 项':'',pauseLabels[view.pauseReason]??view.pauseReason]:[];
    const text=[message,...summary].filter(Boolean).join(' · ');
    if (status.textContent!==text) status.textContent=text;
  }
  function deny() {
    stopped=true;
    DATA.runView=null;
    renderRunActivity();
    if (!artifactCenter.hidden) updateArtifactList();
    showConnection('运行当前不可查看');
  }
  function schedule(delay) {
    clearTimeout(timer);
    if (!stopped) timer=setTimeout(poll,delay);
  }
  function caughtUp(view) {
    return terminal.has(view.status) && (view.cursor===null || view.cursor>=view.revision);
  }
  async function poll() {
    if (busy || stopped) return;
    busy=true;
    const previous=DATA.runView;
    const cursor=previous.cursor??Math.max(-1,previous.revision-50);
    progressUrl.searchParams.set('afterRevision',String(cursor));
    let delay=1000;
    try {
      const response=await fetch(progressUrl,{cache:'no-store',signal:AbortSignal.timeout(8000)});
      if ([400,401,403,404].includes(response.status)) return deny();
      if (!response.ok) throw new Error('Unable to load progress');
      const next=await response.json();
      if (next.runId!==initial.runId || next.artifactHash!==initial.artifactHash ||
          next.graphDigest!==initial.graphDigest || next.candidateHash!==initial.candidateHash ||
          !Object.hasOwn(runLabels,next.status) || !Number.isSafeInteger(next.revision) || next.revision<previous.revision ||
          !Array.isArray(next.pending) || (next.events!==null &&
            (!Array.isArray(next.events) || !Number.isSafeInteger(next.cursor) || next.cursor<cursor || next.cursor>next.revision))) return deny();
      const events=next.events===null ? null : [...(previous.events??[]),...next.events].slice(-250);
      DATA.runView={...previous,...next,events};
      renderRunActivity();
      showConnection();
      retry=1000;
      stopped=caughtUp(DATA.runView);
      if (Number.isSafeInteger(next.cursor) && next.cursor<next.revision) delay=100;
    } catch {
      showConnection('连接中断，正在重连');
      delay=retry;
      retry=Math.min(8000,retry*2);
    } finally {
      busy=false;
      schedule(delay);
    }
  }
  showConnection();
  stopped=caughtUp(initial);
  if (stopped) return;
  window.addEventListener('online',()=>schedule(0));
  window.addEventListener('offline',()=>{ if (!stopped) showConnection('连接中断，正在重连'); });
  schedule(0);
}
})();
</script>
