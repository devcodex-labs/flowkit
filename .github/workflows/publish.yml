name: Publish GitHub Packages

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check explicit release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:check -- --tag "$RELEASE_TAG"

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  pack:
    needs: checks
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Pack exactly one checked artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:pack -- --tag "$RELEASE_TAG"
      - name: Consume the exact candidate bytes
        run: |
          TARBALL="$(node --input-type=module -e 'import{readFileSync}from"node:fs";console.log(".tmp/release/"+JSON.parse(readFileSync(".tmp/release/release.json","utf8")).filename)')"
          npm run docs:examples -- --package "$TARBALL" --evidence .tmp/docs/release-candidate.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        id: npm-artifact
        with:
          name: npm-release-${{ github.run_attempt }}
          path: |
            .tmp/release/*.tgz
            .tmp/release/release.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Record immutable package release identity
        id: release_meta
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          PACKAGE_COMMIT: ${{ github.sha }}
          DOCS_COMMIT: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          NPM_ARTIFACT_ID: ${{ steps.npm-artifact.outputs.artifact-id }}
          NPM_ARTIFACT_DIGEST: ${{ steps.npm-artifact.outputs.artifact-digest }}
        run: |
          export RELEASE_VERSION="${RELEASE_TAG#v}"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          node scripts/docs/release-identity.mjs create --release-dir .tmp/release --out .tmp/release-identity/release-record.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-identity-${{ github.run_attempt }}
          path: .tmp/release-identity/release-record.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  publish:
    # Publishing requires explicit owner approval of the proprietary license.
    if: ${{ vars.FLOWKIT_ENABLE_PACKAGE_PUBLISH == 'true' }}
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@devcodex-labs'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-release-${{ github.run_attempt }}
          path: .tmp/release
      - name: Verify downloaded bytes against the tag and source
        id: artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/release.mjs verify --tag "$RELEASE_TAG"
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; const m=JSON.parse(readFileSync(".tmp/release/release.json","utf8")); appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${m.npmTag}\n`);'
      - name: Publish verified tarball to private GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_DIST_TAG: ${{ steps.artifact.outputs.dist_tag }}
        run: npm publish .tmp/release/*.tgz --registry=https://npm.pkg.github.com/ --tag "$NPM_DIST_TAG"

  private-consumer:
    needs: publish
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
          registry-url: 'https://npm.pkg.github.com'
          scope: '@devcodex-labs'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-release-${{ github.run_attempt }}
          path: .tmp/release
      - name: Verify published GitHub Package stays private
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/docs/check-package-privacy.mjs
      - name: Verify original package and private registry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          node scripts/release.mjs verify --tag "$RELEASE_TAG"
          npm run docs:private-package -- --version "$VERSION" --manifest .tmp/release/release.json --evidence .tmp/docs/private-package.json
      - name: Run consumer examples against the exact private version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          npm run docs:examples -- --registry-version "$VERSION" --manifest .tmp/release/release.json --evidence .tmp/docs/private-consumer.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: private-package-evidence-${{ github.run_attempt }}
          path: .tmp/docs/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 90

  docs:
    # The documentation site remains opt-in until its visibility policy is approved.
    if: ${{ vars.FLOWKIT_ENABLE_PAGES_DEPLOY == 'true' }}
    needs: [pack, private-consumer]
    permissions:
      contents: read
      actions: read
      packages: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      packageReleaseCommit: ${{ github.sha }}
      docsCommit: ${{ github.sha }}
      version: ${{ needs.pack.outputs.version }}
      releaseRunId: ${{ github.run_id }}
      releaseRunAttempt: ${{ github.run_attempt }}
